  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
    <!-- Interactive Aurora Background Canvas -->
    <canvas id="aurora" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.6;"></canvas>
    
    <div id="root"></div>
    
    <!-- Aurora Canvas Animation Script -->
    <script>
      (function() {
        const canvas = document.getElementById('aurora');
        const ctx = canvas.getContext('2d');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetX = mouseX;
        let targetY = mouseY;
        
        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        // Track mouse movement with smooth following
        window.addEventListener('mousemove', (e) => {
          targetX = e.clientX;
          targetY = e.clientY;
        });
        
        // Particle system for aurora effect
        const particles = [];
        const particleCount = 50;
        
        class Particle {
          constructor() {
            this.reset();
          }
          
          reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.radius = Math.random() * 2 + 1;
            this.opacity = Math.random() * 0.5 + 0.2;
          }
          
          update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Attract to mouse position
            const dx = mouseX - this.x;
            const dy = mouseY - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 200) {
              this.vx += dx * 0.00001;
              this.vy += dy * 0.00001;
            }
            
            if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
              this.reset();
            }
          }
          
          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(139, 92, 246, ${this.opacity})`;
            ctx.fill();
          }
        }
        
        // Initialize particles
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }
        
        function drawGradients() {
          // Smooth mouse following
          mouseX += (targetX - mouseX) * 0.05;
          mouseY += (targetY - mouseY) * 0.05;
          
          // Clear canvas
          ctx.fillStyle = 'rgba(2, 6, 23, 0.1)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          // Create animated gradient orbs
          const time = Date.now() * 0.001;
          
          // Violet orb following mouse
          const gradient1 = ctx.createRadialGradient(
            mouseX, mouseY, 0,
            mouseX, mouseY, 400
          );
          gradient1.addColorStop(0, 'rgba(139, 92, 246, 0.4)');
          gradient1.addColorStop(0.5, 'rgba(139, 92, 246, 0.2)');
          gradient1.addColorStop(1, 'rgba(139, 92, 246, 0)');
          ctx.fillStyle = gradient1;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          // Fuchsia orb - animated
          const x2 = canvas.width * 0.7 + Math.sin(time * 0.5) * 100;
          const y2 = canvas.height * 0.3 + Math.cos(time * 0.3) * 100;
          const gradient2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, 350);
          gradient2.addColorStop(0, 'rgba(217, 70, 239, 0.3)');
          gradient2.addColorStop(0.5, 'rgba(217, 70, 239, 0.15)');
          gradient2.addColorStop(1, 'rgba(217, 70, 239, 0)');
          ctx.fillStyle = gradient2;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          // Pink orb - animated
          const x3 = canvas.width * 0.3 + Math.cos(time * 0.4) * 80;
          const y3 = canvas.height * 0.7 + Math.sin(time * 0.6) * 80;
          const gradient3 = ctx.createRadialGradient(x3, y3, 0, x3, y3, 300);
          gradient3.addColorStop(0, 'rgba(236, 72, 153, 0.25)');
          gradient3.addColorStop(0.5, 'rgba(236, 72, 153, 0.12)');
          gradient3.addColorStop(1, 'rgba(236, 72, 153, 0)');
          ctx.fillStyle = gradient3;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          // Update and draw particles
          particles.forEach(particle => {
            particle.update();
            particle.draw();
          });
        }
        
        function animate() {
          drawGradients();
          requestAnimationFrame(animate);
        }
        
        animate();
      })();
    </script>
</body>
