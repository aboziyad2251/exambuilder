<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

  <!-- Aurora Canvas Animation Script -->
  <script>
    (function () {
      const canvas = document.getElementById('aurora');
      const ctx = canvas.getContext('2d');
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let targetX = mouseX;
      let targetY = mouseY;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener('resize', resize);
      resize();

      // Track mouse movement with smooth following
      window.addEventListener('mousemove', (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
      });

      // Particle system for aurora effect
      const particles = [];
      const particleCount = 50;

      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.radius = Math.random() * 2 + 1;
          this.opacity = Math.random() * 0.5 + 0.2;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          // Attract to mouse position
          const dx = mouseX - this.x;
          const dy = mouseY - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 200) {
            this.vx += dx * 0.00001;
            this.vy += dy * 0.00001;
          }

          if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.reset();
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(139, 92, 246, ${this.opacity})`;
          ctx.fill();
        }
      }

      // Initialize particles
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function drawGradients() {
        // Smooth mouse following
        mouseX += (targetX - mouseX) * 0.05;
        mouseY += (targetY - mouseY) * 0.05;

        // Clear canvas
        ctx.fillStyle = 'rgba(2, 6, 23, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Create animated gradient orbs
        const time = Date.now() * 0.001;

        // Violet orb following mouse
        const gradient1 = ctx.createRadialGradient(
          mouseX, mouseY, 0,
          mouseX, mouseY, 400
        );
        gradient1.addColorStop(0, 'rgba(139, 92, 246, 0.4)');
        gradient1.addColorStop(0.5, 'rgba(139, 92, 246, 0.2)');
        gradient1.addColorStop(1, 'rgba(139, 92, 246, 0)');
        ctx.fillStyle = gradient1;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Fuchsia orb - animated
        const x2 = canvas.width * 0.7 + Math.sin(time * 0.5) * 100;
        const y2 = canvas.height * 0.3 + Math.cos(time * 0.3) * 100;
        const gradient2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, 350);
        gradient2.addColorStop(0, 'rgba(217, 70, 239, 0.3)');
        gradient2.addColorStop(0.5, 'rgba(217, 70, 239, 0.15)');
        gradient2.addColorStop(1, 'rgba(217, 70, 239, 0)');
        ctx.fillStyle = gradient2;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Pink orb - animated
        const x3 = canvas.width * 0.3 + Math.cos(time * 0.4) * 80;
        const y3 = canvas.height * 0.7 + Math.sin(time * 0.6) * 80;
        const gradient3 = ctx.createRadialGradient(x3, y3, 0, x3, y3, 300);
        gradient3.addColorStop(0, 'rgba(236, 72, 153, 0.25)');
        gradient3.addColorStop(0.5, 'rgba(236, 72, 153, 0.12)');
        gradient3.addColorStop(1, 'rgba(236, 72, 153, 0)');
        ctx.fillStyle = gradient3;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Update and draw particles
        particles.forEach(particle => {
          particle.update();
          particle.draw();
        });
      }

      function animate() {
        drawGradients();
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>

  <!-- Localization Observer Script for custom UI elements -->
  <script>
    (function () {
      const translations = {
        en: {
          navLectures: "📚 Lecture/Lesson analyzer",
          guideTitle: "Exam Modes",
          modeEasy: "1- Easy mode:",
          descEasy: "Simple, direct questions",
          modeMedium: "2- Medium Mode:",
          descMedium: "Requires complete understanding",
          modeHard: "3- Hard Mode:",
          descHard: "Complex scenarios and deep analysis",
          modeTrickey: "4- Trickey:",
          descTrickey: "Manipulated questions",
          modeTrickyMode: "5- Tricky Mode:",
          descTrickyMode: "Combination of every mode"
        },
        ar: {
          navLectures: "📚 تحليل المنهج/ المحاضره",
          guideTitle: "أنماط الاختبار",
          modeEasy: "١- الوضع السهل:",
          descEasy: "أسئلة بسيطة ومباشرة",
          modeMedium: "٢- الوضع المتوسط:",
          descMedium: "يتطلب فهم كامل",
          modeHard: "٣- الوضع الصعب:",
          descHard: "سيناريوهات معقدة وتحليل أعمق",
          modeTrickey: "٤- مخادع:",
          descTrickey: "أسئلة متلاعبة",
          modeTrickyMode: "٥- وضع مخادع:",
          descTrickyMode: "مزيج من جميع الأوضاع"
        }
      };

      let currentLang = 'en';

      function updateLocale(lang) {
        if (!translations[lang]) return;
        const t = translations[lang];

        // Update Navigation Button
        const navBtn = document.getElementById('nav-lecture-link');
        if (navBtn) navBtn.innerHTML = t.navLectures;

        // Update Guide Box
        const title = document.getElementById('mode-guide-title');
        if (title) title.textContent = t.guideTitle;

        const me = document.getElementById('mode-easy'); if (me) me.textContent = t.modeEasy;
        const de = document.getElementById('mode-easy-desc'); if (de) de.textContent = t.descEasy;

        const mm = document.getElementById('mode-medium'); if (mm) mm.textContent = t.modeMedium;
        const dm = document.getElementById('mode-medium-desc'); if (dm) dm.textContent = t.descMedium;

        const mh = document.getElementById('mode-hard'); if (mh) mh.textContent = t.modeHard;
        const dh = document.getElementById('mode-hard-desc'); if (dh) dh.textContent = t.descHard;

        const mt1 = document.getElementById('mode-trickey'); if (mt1) mt1.textContent = t.modeTrickey;
        const dt1 = document.getElementById('mode-trickey-desc'); if (dt1) dt1.textContent = t.descTrickey;

        const mt2 = document.getElementById('mode-tricky-mode'); if (mt2) mt2.textContent = t.modeTrickyMode;
        const dt2 = document.getElementById('mode-tricky-mode-desc'); if (dt2) dt2.textContent = t.descTrickyMode;

        // Adjust Sidebar position based on lang
        const guide = document.getElementById('exam-modes-guide');
        if (guide) {
          if (lang === 'ar') {
            guide.style.left = 'auto';
            guide.style.right = '1rem';
            guide.style.textAlign = 'right';
          } else {
            guide.style.right = 'auto';
            guide.style.left = '1rem';
            guide.style.textAlign = 'left';
          }
        }
      }

      // Apply initial check
      if (document.documentElement.dir === 'rtl' || document.documentElement.lang === 'ar') {
        currentLang = 'ar';
      }
      updateLocale(currentLang);

      // Setup MutationObserver to watch html tag for 'dir' or class changes
      const observer = new MutationObserver((mutations) => {
        let needsUpdate = false;
        mutations.forEach((mutation) => {
          if (mutation.type === 'attributes' && (mutation.attributeName === 'dir' || mutation.attributeName === 'lang')) {
            needsUpdate = true;
          }
        });

        if (needsUpdate) {
          const newLang = (document.documentElement.dir === 'rtl' || document.documentElement.lang === 'ar') ? 'ar' : 'en';
          if (newLang !== currentLang) {
            currentLang = newLang;
            updateLocale(currentLang);
          }
        }
      });

      observer.observe(document.documentElement, { attributes: true });

      observer.observe(document.documentElement, { attributes: true });

      // Backup periodic check specifically for toggle instead of heavy DOM mutation
      setInterval(() => {
        const isArabicNow = document.body.innerText.indexOf('مستوى التعليم') > -1 || document.body.innerText.indexOf('إنشاء امتحان') > -1;
        const detectedLang = isArabicNow ? 'ar' : 'en';
        if (detectedLang !== currentLang) {
          currentLang = detectedLang;
          updateLocale(currentLang);
        }
      }, 1500);
    })();
  </script>
